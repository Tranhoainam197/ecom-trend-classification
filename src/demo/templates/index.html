<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phân loại xu hướng sản phẩm TMĐT — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="pulse-dot" aria-hidden="true"></span>
      <div class="topbar__titles">
        <span class="topbar__kicker">Khai thác dữ liệu · TMĐT Shopee / Lazada / Tiki</span>
        <h1 class="topbar__title">Phân loại xu hướng sản phẩm</h1>
      </div>
    </div>
    <div class="topbar__meta">
      <div class="badge badge--model">
        <span class="badge__label">Mô hình</span>
        <span class="badge__value" id="model-name-badge">—</span>
      </div>
      <div class="badge badge--accuracy">
        <span class="badge__label">Accuracy (test)</span>
        <span class="badge__value" id="accuracy-badge">—</span>
      </div>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav class="nav" id="nav">
        <button class="nav__item is-active" data-mode="random">
          <span class="nav__icon">🎲</span><span>Ngẫu nhiên</span>
        </button>
        <button class="nav__item" data-mode="search">
          <span class="nav__icon">🔍</span><span>Tìm kiếm</span>
        </button>
        <button class="nav__item" data-mode="category">
          <span class="nav__icon">📂</span><span>Danh mục</span>
        </button>
        <button class="nav__item" data-mode="wrong">
          <span class="nav__icon">❌</span><span>Dự đoán sai</span>
        </button>
        <button class="nav__item" data-mode="compare">
          <span class="nav__icon">📊</span><span>So sánh model</span>
        </button>
      </nav>

      <div class="sidebar__context" id="sidebar-context"></div>

      <div class="sidebar__footer">
        <p>
          Dữ liệu: <strong id="footer-count">—</strong> sản phẩm trong
          <strong class="accent">tập TEST</strong> — mô hình
          <em>chưa từng thấy</em> khi train.
        </p>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="loading" id="loading">Đang tải dữ liệu và mô hình…</div>
    </main>

  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
